name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter './packages/*' build
      - run: pnpm --filter './packages/*' --filter './examples/*' test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/*' build

      # A Renovate patch/minor bump automerges on its own and brings no changeset with it, so
      # the step below would find nothing to publish and the new dependency would reach npm
      # only whenever someone next released by hand. This writes the changeset for it and
      # versions it in place, leaving the release a plain "nothing pending, publish" run.
      # Majors are merged by a person, so github.actor is not renovate[bot] and none of it runs.
      - name: Release a Renovate dependency bump
        if: github.event_name == 'push' && github.actor == 'renovate[bot]'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          node .github/scripts/renovate-patch-release.mjs
          if [ -z "$(git status --porcelain .changeset)" ]; then exit 0; fi
          pnpm version-packages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: version packages"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
